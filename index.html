<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Natal Solidário - Monte Tabor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Música de fundo -->
  <audio id="bg-music" src="music.mpeg" loop autoplay></audio>

  <div class="poster-container">
    <img src="img.jpeg" alt="Cartaz Natal Solidário" class="poster-img">
    
    <!-- Área clicável do Pix com pulso brilhante para celular -->
    <div class="pix-hotspot" id="open-pix-modal" title="Clique para abrir as informações do Pix"></div>
  </div>

  <!-- Modal / Tela com o QR Code e opções do Pix -->
  <div id="pix-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="close-modal">&times;</span>
      <h2>Chave Pix - Natal Solidário</h2>
      
      <div class="qr-container">
        <img src="qrcode.png" alt="QR Code Pix" class="qr-code" onerror="this.src='img.jpeg'">
      </div>

      <p class="pix-info"><strong>Chave (Tel):</strong> <span id="pix-key">62367078394</span></p>
      <p class="pix-info"><strong>Titular:</strong> Ana vitoria lima almeida</p>
      <p class="pix-info"><strong>App:</strong> PicPay</p>

      <button id="copy-btn" class="copy-btn">Copiar Chave Pix</button>
      <span id="copy-msg" class="copy-msg">Copiado com sucesso!</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
